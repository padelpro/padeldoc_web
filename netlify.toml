[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Viewer routes: serve the SPA tool for any share code. These edge rewrites (status 200) are
# evaluated before the Next handler, so they reliably serve the static tool HTML — Next's
# rewrites() 404 for a dynamic source pointing at a static file on this runtime (see next.config.ts).
[[redirects]]
  from = "/m/*"
  to = "/scoreboard/index.html"
  status = 200
[[redirects]]
  from = "/embed/m/*"
  to = "/scoreboard/index.html"
  status = 200
[[redirects]]
  from = "/t/*"
  to = "/americano/index.html"
  status = 200
[[redirects]]
  from = "/v/*"
  to = "/tagger/index.html"
  status = 200
[[redirects]]
  from = "/contribute/withdraw"
  to = "/tagger/index.html"
  status = 200
[[redirects]]
  from = "/p/*"
  to = "/player/index.html"
  status = 200
[[redirects]]
  from = "/coach"
  to = "/player/index.html"
  status = 200
[[redirects]]
  from = "/coach/*"
  to = "/player/index.html"
  status = 200

# One sign-in page for players, coaches and clubs, and a player account's own page: sign-up, My page and a coach's
# invite link (padel-coach-src sessions SI1, D1, D2). All in the player bundle.
[[redirects]]
  from = "/signin"
  to = "/player/index.html"
  status = 200
# My page has its own copy of the player bundle (padel-coach-src build target "me"), linking /me.webmanifest: installed
# from My page, the app is Padel Doc with Android's Share menu target, /me/add-booking (calendar-feed-spec 2.1, 2.13). The
# player page's manifest and icons are unchanged.
[[redirects]]
  from = "/me"
  to = "/me/index.html"
  status = 200
[[redirects]]
  from = "/me/*"
  to = "/me/index.html"
  status = 200

# The admin's usage dashboard (Kevin 29 Oct 2026), in the player bundle.
[[redirects]]
  from = "/admin"
  to = "/player/index.html"
  status = 200
# The academy section of the coach dashboard (academy pilot P1, Kevin 8 Nov 2026): the coach page opens on it; anyone not
# staff in an academy, or not on the ACADEMY list, sees "page not found" (GET /v1/academy answers them 404).
[[redirects]]
  from = "/academy"
  to = "/player/index.html"
  status = 200

# Public profile pages (Kevin 28 Oct 2026), thepadeldoc.com/<name>: served by netlify/edge-functions/profile.ts, which
# also moves /@name to /name. app/profile-path.ts has the rule.

# Community (padel-coach-src Community part 1): the feed, a zone and a post, in the player bundle for every account.
[[redirects]]
  from = "/community"
  to = "/player/index.html"
  status = 200
[[redirects]]
  from = "/community/*"
  to = "/player/index.html"
  status = 200

# Box League (padel-coach-src box-league-spec.md): one page serves the club dashboard (/club), the club request
# form (/club/join), a player's private link (/league/me#token) and a league's public page (/league/CODE).
[[redirects]]
  from = "/club"
  to = "/league/index.html"
  status = 200
[[redirects]]
  from = "/club/*"
  to = "/league/index.html"
  status = 200
[[redirects]]
  from = "/league/*"
  to = "/league/index.html"
  status = 200

# Player alerts (padel-share-api 0010). The service worker must never be served stale, or a fix to it would
# take days to reach phones. The manifest has no start_url on purpose: the home-screen icon opens the page
# it was added from (the player's own /p/:code link).
[[headers]]
  for = "/player-sw.js"
  [headers.values]
    Cache-Control = "no-cache"
# The Tactics Board's offline worker (Drill Builder D1, Kevin 9 Nov 2026): never served stale either, so a new build
# or the kill switch reaches the browsers that have it on the next load.
[[headers]]
  for = "/tactics-sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/player.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/me.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# The split player and me pages (padel-coach-src build/split.mjs; Kevin 7 Nov 2026). Their chunks in /tabs/ carry a content
# hash in the name, so a file never changes: kept a year without asking again. The pages that load them are always
# checked first (no-cache), so a release never pairs an old page with new chunks or the other way round.
[[headers]]
  for = "/tabs/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# The tool pages' fonts (padel-coach-src build.mjs; Kevin 7 Nov 2026): Spline Sans and IBM Plex Mono, once inlined in
# every page, now files with a content hash in the name (spline-sans-latin-var-<hash>.woff2), so kept a year the same way.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "font/woff2"
[[headers]]
  for = "/player/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/me"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/me/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/p/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/coach"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/coach/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/signin"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/academy"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/community"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/community/*"
  [headers.values]
    Cache-Control = "no-cache"

# Preset avatars (padel-coach-src avatars-spec.md 2.1): copied to public/avatars/ by release.mjs, one file per id.
# A file never changes (a new image would get a new id), so browsers keep them for a year without asking again.
[[headers]]
  for = "/avatars/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/unsubscribe"
  to = "https://padel-share.padel-coach.workers.dev/v1/signin/unsubscribe"
  status = 200
  force = true

# The private calendar feed (padel-share-api 0076, padel-coach-src specs/calendar-feed-spec.md 1.2): the link people paste
# into Google, Apple or Outlook is thepadeldoc.com/cal/<token>.ics, proxied to the Worker's /v1/cal/<token>.ics, which
# answers with its own Cache-Control (private, 15 minutes) and ETag.
[[redirects]]
  from = "/cal/*"
  to = "https://padel-share.padel-coach.workers.dev/v1/cal/:splat"
  status = 200
  force = true

e unless you change it. These follow the saved setup, so save a change above first.",set:"SET {n}",pair:"Pair {team}",notYet:"Asked when the match gets there.",noServe:"Set who serves first above to use this."}},builder:{open:"Quick tag panel",title:"Quick tag panel",subtitle:"Choose the quick buttons for this match. The video stays paused while this is open.",library:"Library",libraryHint:"Switch W, F or U on to add that button to the end of your panel. Switch it off to remove it.",toggleOff:"Add {type} {outcome}",toggleOn:"Remove {type} {outcome}",preview:"Your panel",previewHint:"This is how the quick buttons will look. Drag a tile to reorder. Click a key box and press a key; Backspace clears it.",empty:"No quick buttons. Detailed tags and [ ] still work.",outcomeShort:{winner:"W",forced:"F",unforced:"U"},keyLabel:"Key for {button}",keyPlaceholder:"Key",tray:"Tray",remove:"Remove {button}",keyErrors:{reserved:"{key} is reserved for playback and tagging.",duplicate:"{key} is already used by {button}.",invalid:"Use a single letter, number or symbol."},keyNames:{" ":"Space",ArrowLeft:"Left arrow",ArrowRight:"Right arrow",Escape:"Esc",Enter:"Enter",Delete:"Delete",Backspace:"Backspace"},numpadName:"Num {key}",clipDefaults:"Clip defaults",before:"Before (s)",after:"After (s)",minGap:"Min gap (s)",makeDefault:"Use as my default for new matches",resetDefault:"Reset to built-in panel",defaultReset:"Built-in panel loaded. Save to use it for this match and for new matches.",defaultFailed:"Could not save on this device.",cancel:"Cancel",save:"Save",discardAsk:"Discard changes?",discard:"Discard",keepEditing:"Keep editing",settingsOpen:"Tag settings",settingsTitle:"Tag settings",settingsSubtitle:"The rally presses, rally length bands, clip window and gap between tags. The video stays paused while this is open.",resetSettings:"Reset to built-in"},live:{badge:"LIVE",behind:"Behind live {time}",backToLive:"Back to live",mismatchTitle:"Tag times may be off",mismatchLonger:"This match was tagged on a live stream. The replay is {secs}s longer than the stream was, so every tag may be early or late by a fixed amount.",mismatchShorter:"This match was tagged on a live stream. The replay is {secs}s shorter than the stream was, so every tag may be early or late by a fixed amount.",mismatchHint:"Jump to a tag, see how far off it is, then shift all tags by that many seconds.",dismiss:"Dismiss"},shift:{open:"Shift all tags",label:"Seconds (use - for earlier)",placeholder:"e.g. -12.5",apply:"Shift",cancel:"Cancel",invalid:"Type a number of seconds, for example 8 or -12.5.",doneOne:"Moved 1 tag by {delta}s.",done:"Moved {n} tags by {delta}s."},tour:{chip:"First time? Take the quick tour.",chipStart:"Show me around",chipDismiss:"Dismiss tour tip",labels:{dialog:"Guided tour",skip:"Skip tour",next:"Next",done:"Done",yourTurn:"Your turn"},steps:{load:{title:"Load a match video",body:"Paste a YouTube link and press Load video, or press Open file for a video on this computer. A link with a start time opens right at that moment."},transport:{title:"Play and seek",body:"Space plays or pauses and the arrows seek 5 seconds. Tagging switches on once the video has played or been seeked."},setup:{title:"Set up the match",body:"Names, sides, hands and who serves first. The live score and the serve checks use them."},quick:{title:"Quick tags",body:"One click or its key tags the shot at that moment. The video keeps playing."},firstTag:{title:"Tag one now",body:"Press a quick button or its key. Undo or Backspace takes it back."},players:{title:"Tag a shot",body:"The player buttons, in team colours, start a tag and pause the video. Keys 1 to 4 do the same."},points:{title:"Point A and Point B",body:"Log a point with no shot detail, for rallies you do not tag. Keys [ and ]."},serve2:{title:"Rally presses",body:"Press 1st serve or 2nd serve at serve contact (Z and /), and Rally end when the rally ends (X). Each point in the list then shows its rally length."},panel:{title:"Your quick tag panel",body:"Choose the buttons, their keys and the clip window. You can make it your default for new matches."},list:{title:"Your tags",body:"Click a tag to jump to it. Nudge it, retype its time, edit or delete it here."},review:{title:"Review and play clips",body:"Review has the Coach report on top: every count plays its clips, and Edit words adds your summary, key moment and coaching points. Under it, pick a player or pair, then filters; Play these plays exactly the listed clips."},help:{title:"Help any time",body:"The ? button explains every control and can replay this tour."},settings:{title:"Tag settings",body:"Set the clip window, the gap between tags, the rally press keys and the rally length bands. You can make them your default for new matches."}}},help:{title:"Match Tagger help",close:"Close help",button:"Help",replay:"Show me around",tooltips:{label:"Tooltips",on:"On",off:"Off",hint:"Hover hints on buttons. Turn them off once you know the tools. Remembered on this device."},replaySub:"Replay the guided walkthrough",sections:[{id:"start",title:"Getting started",entries:[{id:"gs-load",label:"1. Load a video",long:"Paste a YouTube link or video ID and press Load video, or press Open file to use a video on this computer. Unlisted YouTube videos work; private ones do not. A link with t= or start= opens paused at that time."},{id:"gs-setup",label:"2. Set up the match",long:"Open Match setup for names, court sides, hands, who serves first, the third set format and deuce. The live score and serve checks follow it."},{id:"gs-play",label:"3. Start the video",long:"Tagging switches on once the video has played or been seeked since it loaded."},{id:"gs-tag",label:"4. Tag",long:"Use quick buttons for speed, the player buttons for a detailed tag, or Point A and Point B to score a rally without shot detail."}]},{id:"tagging",title:"Tagging",entries:[{id:"t-time",label:"The tag time",long:"A tag takes the video time at your first click or key press, never when you finish it."},{id:"t-quick",label:"Quick tags",long:"One click or key writes the tag and the video keeps playing. If the button has its tray on, a small tray asks who hit it and where from. It closes by itself."},{id:"t-detail",label:"Detailed tags",long:"Pick the player to start. The video pauses while you choose the outcome, shot, hand, who was forced (forced) or the error reason (unforced) and where it was hit, then carries on from the same moment. Esc cancels."},{id:"t-points",label:"Point A and Point B",long:"Keys [ and ] log a point to a team with no shot detail. They count in the score but not in shot stats."},{id:"t-serve2",label:"Rally presses and 2nd serves",long:"Press 1st serve at serve contact and the rally starts there. After a fault, press 2nd serve at the 2nd serve's contact: the point's tag is then marked as a 2nd serve and shows a 2nd badge. A let: press the serve again. Press Rally end when the rally ends if you tag the point late; otherwise the point's tag ends it. Presses are not tags: no gap rule, and they show as thin ticks on the timeline. Each point shows its rally length and band, or DF for a double fault. A point with no serve press has no length. An unforced error on a serve counts as a double fault, pressed or not."},{id:"t-gap",label:"Too close",long:"A new tag within the panel's minimum gap of another tag is blocked, and the message names that tag's time. Set the gap to 0 in the Quick tag panel to turn this off."},{id:"t-score",label:"Scoring",long:"Every tag with a player or team is one point, replayed in video order. Winners and forced errors go to the tagged team, unforced errors to the other. A quick tag with no player is not scored until you set one."},{id:"t-check",label:"Check badges",long:"A new tag that does not fit the serve (a serve by a player who was not serving, a serve from the wrong side for the score, a return by the serving pair) shows an orange bar with Undo and Ignore. The tag keeps a Check badge. It is a hint only; nothing is blocked."},{id:"t-servers",label:"Who serves in sets 2 and 3",long:"From set 2 the video pauses when a pair serves its first game of the set and asks who is serving. The player in order is pre-picked. Pick the other and the order for that pair changes from that set. You can also change it in Match setup."}]},{id:"keys",title:"Keys",entries:[{id:"k-play",label:"Playback",long:"Space or K plays and pauses. Left and Right, or J and L, seek 5 seconds; hold Shift for 1 second. While a playlist plays, Down and Up (or Page Down and Page Up) step to the next and previous clip, and Esc stops it."},{id:"k-tag",label:"Tagging",long:"1 to 4 pick a player. [ and ] log a point to A or B. Z, / and X press 1st serve, 2nd serve and Rally end. Enter finishes, Esc cancels, Backspace undoes the last tag or press, Delete removes the selected tag. Comma and period nudge the selected point's end by half a second (any other tag moves), < and > its start."},{id:"k-own",label:"Your keys",long:"Give each quick button its own key in the Quick tag panel. The keys above are reserved and cannot be used."}]},{id:"list",title:"Tags and timeline",entries:[{id:"l-jump",label:"Jump to a tag",long:"Click a tag in the list or a marker on the timeline to jump to it, starting a few seconds early (the clip window's before time)."},{id:"l-fix",label:"Fix a tag",long:"Nudge it by half a second (Shift for 2 seconds), click its time to type an exact mm:ss, or Edit it. On a point the nudge moves the rally end; select the point for the Start buttons. Edit also sets that tag's own clip window."},{id:"l-order",label:"List order",long:"Video order sorts by time in the video. Newest first shows what you tagged last at the top."},{id:"l-shift",label:"Shift all tags",long:"Moves every tag earlier or later by the same number of seconds. Useful when a replay does not line up with the live stream you tagged."}]},{id:"panel",title:"Quick tag panel",entries:[{id:"p-build",label:"Build your panel",long:"Switch W, F or U on a shot to add that button, and off to remove it. Drag tiles in the preview to reorder them."},{id:"p-keys",label:"Keys and tray",long:"Click a key box and press a key; Backspace clears it. Tray on shows the player and court tray after that tag."},{id:"p-clip",label:"Clip window and gap",long:"Before and after set how much video plays around a tag. Min gap sets the shortest time allowed between new tags."},{id:"p-rally",label:"Rally keys and bands",long:"Set the keys for 1st serve, 2nd serve and Rally end (or clear one to use the button only), and where Short, Medium and Long rallies end, in whole seconds. Numpad keys work too (Num 1 and so on), with NumLock on or off. Once a press uses a numpad key, the other numpad digits do nothing; the 1 to 4 keys above the letters still pick players. They save with the match."},{id:"p-default",label:"Your default",long:"Use as my default starts every new match with this panel. Reset to built-in panel goes back to the original set. Esc with unsaved changes asks before discarding them."}]},{id:"review",title:"Review",entries:[{id:"r-switch",label:"Tag and Review",long:"The switch at the top of the right column changes between tagging and reviewing. In Review the tagging keys are off; playback and playlist keys still work."},{id:"r-filter",label:"Filters",long:"Pick shots, outcomes, hands, error reasons, servers, serving or receiving, games, 2nd serves or break, set and match points. Choices in one row add together; rows narrow each other. The filter also applies to the tag list and the timeline."},{id:"r-players",label:"Players and pairs",long:"The row at the top of Review shows everyone, one pair or one player. A pair shows both players of that team. Anyone without tags is greyed out. The rest of the filter is unchanged."},{id:"r-coach",label:"Coach report",long:"The report players see, on top of Review: result, team totals, set by set, a card per player and pressure points. It always counts the whole match. Tap a count to play exactly those clips; open a bar to see each shot, forehand and backhand."},{id:"r-coach-words",label:"Your words and coaching points",long:"Press Edit words. Pick who the report is for, then write a summary and a key moment. For a coaching point, filter to the clips you want (a report count is the quickest way), then press Use the filtered tags. Up to 5 points per player, 20 clips each."},{id:"r-coach-share",label:"What players see",long:"The player link shows the Coach report with your words, in a light layout made for phones. Players can play every count, their highlights and your coaching points; they cannot edit anything."},{id:"r-report",label:"Report",long:"The Match Tracker's report for the filtered tags. Click any count to filter to those tags. Totals, hand cards, error reasons and serve lines also have a play button that filters and plays those clips at once. Momentum always shows the whole match."},{id:"r-pressure",label:"Pressure points",long:"Break, game, set and match points, deuce, golden and star points, and 2nd serve points in the filtered tags, with how many each pair won. Click a row to filter to those points, or play them. Who forced whom counts forced errors by who forced them and who made them."},{id:"r-clips",label:"Clips list",long:"Under the report, every tag that matches the filter, in video order, with the score before each point. Click a row to jump to it. Play these plays exactly the listed clips. The clip playing now is highlighted."},{id:"r-playlist",label:"Playlist",long:"Play filtered plays each tag's clip back to back, using the tag's own clip window or the panel's. Whole point starts each clip at the previous tag instead, up to 40 s, so you see the rally. Clips that overlap play as one. Down and Up, or Next and Previous, step through clips; Esc or Stop ends it. Loop starts again after the last clip."},{id:"r-held",label:"Moving away",long:"If you seek away from the clips yourself, the playlist waits. Resume picks up from the nearest clip."},{id:"r-csv",label:"CSV export",long:"Export CSV saves the filtered tags, with the score before each point and a link to the start of each clip: a YouTube link, or for a video file its name with #t= and the seconds."}]},{id:"live",title:"Live streams",entries:[{id:"v-live",label:"Tagging a live stream",long:"The tagger spots a YouTube live stream by its length growing. LIVE shows when you are within 15 seconds of the live edge; otherwise it shows how far behind you are, with Back to live."},{id:"v-replay",label:"Replays",long:"When the stream becomes a replay its times can differ from the live ones. If the replay's length is more than 10 seconds off, a warning offers Shift all tags."}]},{id:"files",title:"Video files",entries:[{id:"f-open",label:"Opening a file",long:"Open file plays a video from this computer. It is never uploaded. Chrome plays most MP4, MOV and WebM files. Live stream features and link start times are for YouTube only."},{id:"f-reopen",label:"Coming back to a match",long:"The video is not saved with the match, only its name, length and size. After a reload, open the same file again. A renamed file is fine. If the length or size differ you are warned and can still use it, then shift all tags if they are off."},{id:"f-cant",label:"Files that will not play",long:"Phone videos recorded in High Efficiency (HEVC) often will not play on some computers. Convert to an H.264 MP4 (HandBrake's Fast 1080p30 preset works), or set the iPhone to Settings > Camera > Formats > Most Compatible."}]},{id:"storage",title:"Saving",entries:[{id:"s-draft",label:"On this device",long:"The match is saved on this device as you go. For a video file only its name, length and size are saved, never the video. New match or a different video clears it, after asking."}]}],noQuick:{drop:["t-quick","k-own","p-build","p-keys"],replace:{"gs-tag":{long:"Pick a player to tag a shot, or use Point A and Point B to score a rally without shot detail."},"t-detail":{label:"Tags"},"t-gap":{long:"A new tag within the minimum gap of another tag is blocked, and the message names that tag's time. Set the gap to 0 in Tag settings to turn this off."},"t-score":{long:"Every tag with a player or team is one point, replayed in video order. Winners and forced errors go to the tagged team, unforced errors to the other."},"p-default":{long:"Use as my default starts every new match with these settings. Reset to built-in goes back to the original ones. Esc with unsaved changes asks before discarding them."}},titles:{panel:"Tag settings"}}},tips:{toolbar:{video:"Load a YouTube link, a video file on this computer, or a match from the cloud. New match is here too.",setup:"Match setup (names, sides, who serves) and Tag settings (clip window, rally press keys).",share:"Send this match to a player's page, contribute it, or download it as a CSV.",help:"Send feedback, or open the help and the tour."},resumeOpen:"Open the saved match where you left it.",resumeNew:"Start a fresh match. The saved one is kept on this device.",coach:{edit:"Write the summary, key moment and coaching points. Players see them in their link.",editDone:"Stop editing. Your words are saved with the match.",hide:"Hide the Coach report",show:"Show the Coach report",play:"Play these {n} clips",highlights:"Play this player's winners and the errors they forced ({n} clips)",tab:"Show {tab} by shot",bar:"Open to see each shot, forehand and backhand, and the clip times",clipTime:"Jump to this tag in the video",removeClip:"Take this clip out of the coaching point",ourPair:"Write the report for {pair}. The player cards follow this pick.",useFilteredRun:"Set the key moment to run from the first to the last of the {n} filtered tags",useFilteredPoint:"Give this point the filtered tags as its clips (up to {max})",filterFirst:"Set a filter in Review first (a report count is the quickest way), then use its tags here",clearRun:"Take the points off the key moment, keep the text",playRun:"Play

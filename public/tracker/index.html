 +, then From URL.","Paste your link and click Add calendar.","It then shows on your phone too. In the Google Calendar app, open Settings, tap the calendar and turn Sync on if it's off."],renameHint:"Already subscribed? Rename it in Google Calendar settings, or remove it and add the link again, to see the new name.",googleButtonHint:"The button opens step 3 already filled in, on a computer.",outlook:"Outlook",outlookSteps:["Outlook.com and the new Outlook: Calendar, Add calendar, Subscribe from web. Paste your link, name it, Import.","Classic Outlook for Windows: Home, Add Calendar, From Internet. Paste your link, OK."],refresh:"Google updates every 8 to 24 hours. Apple and Outlook are faster.",what:"What goes in",types:{padel:"Padel: matches, tournaments, box league",gym:"Off court: gym sessions, runs, appointments",coach:"Coach sessions",unavailable:"Times you're not available (never the private ones)"},reset:"Reset link",resetSure:"Your old link stops working now. Add the new one to your calendar app, and remove the old calendar there.",resetYes:"Yes, make a new link",resetDone:"New link made. The old one has stopped.",coachTitle:"Your coaching in your calendar app",coachIntro:"Your lessons in your own calendar app. Keep the link private.",coachIntroMore:'Each lesson shows as "Coaching", with its time. Anyone with the link sees them.',showNames:"Show first names in the feed.",error:"The calendar link isn't available right now."},timezone:{label:"Time zone",hint:"Your events use this, unless they're at a venue in another zone."},coach:{title:"Calendar",intro:"Your lessons, and what your players share with you. Click a day to schedule a lesson.",allPlayers:"All players",player:"Player",levelSays:"{name} lets you: {level}.",levelNone:"{name} has turned off your access. You see your own lessons only.",pageOnly:"{name} hasn't linked an account yet. What you add here moves to their calendar when they do.",notAvailable:"{name}: not available",add:"+ Add for {name}",noPlayers:"No players yet."},thisIsMe:{title:"Show my league matches in my calendar",body:"Tie this league link to your Padel Doc account, so your box matches show in your calendar and your calendar app.",button:"This is me",done:"Your league matches are in your calendar.",undo:"Untie",taken:"This member is already tied to another account."},error:"Couldn't load. Check your connection and try again.",coachSettings:{line:"Your lessons in Google, Apple or Outlook, with your private calendar link.",link:"Calendar link"},help:{button:"Calendar help",title:"Calendar help",close:"Close help",player:[{id:"on",title:"What's on it",entries:[{id:"what",label:"Everything in one place",long:"Your coach's lessons, your tournaments and their matches, your gym sessions, your box league matches and what you add yourself."},{id:"colours",label:"Colours",long:"Padel is blue, Gym is amber, Coach is green and Not available is grey. What else you plan off the court, a run or an appointment, has its own colour. Each item says its type too. Show, above the calendar, hides or shows a type."},{id:"views",label:"Month, Week, Day or List",long:"The button beside the title picks the view. Month shows the whole month, Week and Day the hours. List shows what's coming, day by day; Show earlier and Show later move it."}]},{id:"add",title:"Adding",entries:[{id:"types",label:"What you can add",long:"Tap + at the top: book a court, a gym session, anything off the court (gym, a run, an appointment), a lesson with your coach, a time you're not available, or log a session. An appointment is private: your coach sees a busy time and nothing else unless you tick Show my coach. On the calendar it adds to the day you're looking at. Tournaments live in My tournaments and show here on their own."},{id:"where",label:"Where",long:"Start typing the venue and pick it. A new one is saved at once and only you see it until it's checked. Not a venue keeps your words on this event only."},{id:"private",label:"Times you can  has played or been seeked since it loaded."},{id:"gs-tag",label:"4. Tag",long:"Use quick buttons for speed, the player buttons for a detailed tag, or Point A and Point B to score a rally without shot detail."}]},{id:"tagging",title:"Tagging",entries:[{id:"t-mirrored",label:"A mirrored video",long:"Tick This video is mirrored in Match setup. The tagging court is then drawn the way the video shows it, so tap where you see the ball; left and right are saved the right way round. Want the picture the right way round? Flip the clip before uploading (on Windows: Clipchamp, Flip horizontal), or use a video-mirror browser extension."},{id:"t-time",label:"The tag time",long:"A tag takes the video time at your first click or key press, never when you finish it."},{id:"t-quick",label:"Quick tags",long:"One click or key writes the tag and the video keeps playing. If the button has its tray on, a small tray asks who hit it and where from. It closes by itself."},{id:"t-detail",label:"Detailed tags",long:"Pick the player to start. The video pauses while you choose the outcome, shot, hand, who was forced (forced) or the error reason (unforced) and where it was hit, then carries on from the same moment. Esc cancels."},{id:"t-points",label:"Point A and Point B",long:"Keys [ and ] log a point to a team with no shot detail. They count in the score but not in shot stats."},{id:"t-voids",label:"Let and Ball on court",long:"Let (Num +): a net cord or the receiver wasn't ready. It voids the last serve press (and any Rally end after it); the same serve is retaken, and a let is never a fault. Press the retaken serve as usual. Ball on court (Num -): a ball or person from outside stopped play. It voids this point's serve and Rally end presses and any tag still waiting for its player; the point is replayed from the 1st serve. Voided items stay on the timeline, faded, and are left out of the score, the stats, rally lengths, clips and the CSV. A voided tag shows a Replayed chip in the list; it can be deleted, not edited. Points show a Let or Replayed chip, and the report counts lets per server. Undo takes a Let or Ball on court back and brings back what it voided. Change either key in Tag settings."},{id:"t-serve2",label:"Rally presses and 2nd serves",long:"Press 1st serve at serve contact and the rally starts there. After a fault, press 2nd serve at the 2nd serve's contact: the point's tag is then marked as a 2nd serve and shows a 2nd badge. A let: press Let (below). Press Rally end when the rally ends if you tag the point late; otherwise the point's tag ends it. Presses are not tags: no gap rule, and they show as thin ticks on the timeline. Each point shows its rally length and band, or DF for a double fault. A point with no serve press has no length. An unforced error on a serve counts as a double fault, pressed or not."},{id:"t-gap",label:"Too close",long:"A new tag within the panel's minimum gap of another tag is blocked, and the message names that tag's time. Set the gap to 0 in the Quick tag panel to turn this off."},{id:"t-score",label:"Scoring",long:"Every tag with a player or team is one point, replayed in video order. Winners and forced errors go to the tagged team, unforced errors to the other. A quick tag with no player is not scored until you set one."},{id:"t-check",label:"Check badges",long:"A new tag that does not fit the serve (a serve by a player who was not serving, a serve from the wrong side for the score, a return by the serving pair) shows an orange bar with Undo and Ignore. The tag keeps a Check badge. It is a hint only; nothing is blocked."},{id:"t-servers",label:"Who serves in sets 2 and 3",long:"From set 2 the video pauses when a pair serves its first game of the set and asks who is serving. The player in order is pre-picked. Pick the other and the order for that pair changes from that set. You can also change it in Match setup."}]},{id:"keys",title:"Keys",entries:[{id:"k-play",label:"Playback",long:"Space or K plays and pauses. Left and Right, or J and L, seek 5 seconds; hold Shift for 1 second. While a playlist plays, Down and Up (or Page Down and Page Up) step to the next and previous clip, and Esc stops it."},{id:"k-tag",label:"Tagging",long:"1 to 4 pick a player. [ and ] log a point to A or B. Z, / and X press 1st serve, 2nd serve and Rally end. Enter finishes, Esc cancels, Backspace undoes the last tag or press, Delete removes the selected tag. Comma and period nudge the selected point's end by half a second (any other tag moves), < and > its start."},{id:"k-own",label:"Your keys",long:"Give each quick button its own key in the Quick tag panel. The keys above are reserved and cannot be used."}]},{id:"list",title:"Tags and timeline",entries:[{id:"l-jump",label:"Jump to a tag",long:"Click a tag in the list or a marker on the timeline to jump to it, starting a few seconds early (the clip window's before time)."},{id:"l-fix",label:"Fix a tag",long:"Nudge it by half a second (Shift for 2 seconds), click its time to type an exact mm:ss, or Edit it. On a point the nudge moves the rally end; select the point for the Start buttons. Edit also sets that tag's own clip window."},{id:"l-order",label:"List order",long:"Video order sorts by time in the video. Newest first shows what you tagged last at the top."},{id:"l-shift",label:"Shift all tags",long:"Moves every tag earlier or later by the same number of seconds. Useful when a replay does not line up with the live stream you tagged."}]},{id:"panel",title:"Quick tag panel",entries:[{id:"p-build",label:"Build your panel",long:"Switch W, F or U on a shot to add that button, and off to remove it. Drag tiles in the preview to reorder them."},{id:"p-keys",label:"Keys and tray",long:"Click a key box and press a key; Backspace clears it. Tray on shows the player and court tray after that tag."},{id:"p-clip",label:"Clip window and gap",long:"Before and after set how much video plays around a tag. Min gap sets the shortest time allowed between new tags."},{id:"p-rally",label:"Rally keys and bands",long:"Set the keys for 1st serve, 2nd serve and Rally end (or clear one to use the button only), and where Short, Medium and Long rallies end, in whole seconds. Numpad keys work too (Num 1 and so on), with NumLock on or off. Once a press uses a numpad key, the other numpad digits do nothing; the 1 to 4 keys above the letters still pick players. They save with the match."},{id:"p-default",label:"Your default",long:"Use as my default starts every new match with this panel. Reset to built-in panel goes back to the original set. Esc with unsaved changes asks before discarding them."}]},{id:"review",title:"Review",entries:[{id:"r-switch",label:"Tag and Review",long:"The switch at the top of the right column changes between tagging and reviewing. In Review the tagging keys are off; playback and playlist keys still work."},{id:"r-filter",label:"Filters",long:"Pick shots, outcomes, hands, error reasons, servers, serving or receiving, games, 2nd serves or break, set and match points. Choices in one row add together; rows narrow each other. The filter also applies to the tag list and the timeline."},{id:"r-players",label:"Players and pairs",long:"The row at the top of Review shows everyone, one pair or one player. A pair shows both players of that team. Anyone without tags is greyed out. The rest of the filter is unchanged."},{id:"r-coach",label:"Coach report",long:"The report players see, on top of Review: result, team totals, set by set, a card per player and pressure points. It always counts the whole match. Tap a count to play exactly those clips; open a bar to see each shot, forehand and backhand."},{id:"r-coach-words",label:"Your words and coaching points",long:"Press Edit words. Pick who the report is for, then write a summary and a key moment. For a coaching point, filter to the clips you want (a report count is the quickest way), then press Use the filtered tags. Up to 5 points per player, 20 clips each."},{id:"r-coach-share",label:"What players see",long:"The player link shows the Coach report with your words, in a light layout made for phones. Players can play every count, their highlights and your coaching points; they cannot edit anything."},{id:"r-report",label:"Report",long:"The Match Tracker's report for the filtered tags. Click any count to filter to those tags. Totals, hand cards, error reasons and serve lines also have a play button that filters and plays those clips at once. Momentum always shows the whole match."},{id:"r-pressure",label:"Pressure points",long:"Break, game, set and match points, deuce, golden and star points, and 2nd serve points in the filtered tags, with how many each pair won. Click a row to filter to those points, or play them. Who forced whom counts forced errors by who forced them and who made them."},{id:"r-clips",label:"Clips list",long:"Under the report, every tag that matches the filter, in video order, with the score before each point. Click a row to jump to it. Play these plays exactly the listed clips. The clip playing now is highlighted."},{id:"r-playlist",label:"Playlist",long:"Play filtered plays each tag's clip back to back, using the tag's own clip window or the panel's. Whole point starts each clip at the previous tag instead, up to 40 s, so you see the rally. Clips that overlap play as one. Down and Up, or Next and Previous, step through clips; Esc or Stop ends it. Loop starts again after the last clip."},{id:"r-held",label:"Moving away",long:"If you seek away from the clips yourself, the playlist waits. Resume picks up from the nearest clip."},{id:"r-csv",label:"CSV export",long:"Export CSV saves the filtered tags, with the score before each point and a link to the start of each clip: a YouTube link, or for a video file its name with #t= and the seconds."}]},{id:"live",title:"Live streams",entries:[{id:"v-live",label:"Tagging a live stream",long:"The tagger spots a YouTube live stream by its length growing. LIVE shows when you are within 15 seconds of the live edge; otherwise it shows how far behind you are, with Back to live."},{id:"v-replay",label:"Replays",long:"When the stream becomes a replay its times can differ from the live ones. If the replay's length is more than 10 seconds off, a warning offers Shift all tags."}]},{id:"files",title:"Video files",entries:[{id:"f-open",label:"Opening a file",long:"Open file plays a video from this computer. It is never uploaded. Chrome plays most MP4, MOV and WebM files. Live stream features and link start times are for YouTube only."},{id:"f-reopen",label:"Coming back to a match",long:"The video is not saved with the match, only its name, length and size. After a reload, open the same file again. A renamed file is fine. If the length or size differ you are warned and can still use it, then shift all tags if they are off."},{id:"f-cant",label:"Files that will not play",long:"Phone videos recorded in High Efficiency (HEVC) often will not play on some computers. Convert to an H.264 MP4 (HandBrake's Fast 1080p30 preset works), or set the iPhone to Settings > Camera > Formats > Most Compatible."}]},{id:"storage",title:"Saving",entries:[{id:"s-draft",label:"On this device",long:"The match is saved on this device as you go. For a video file only its name, length and size are saved, never the video. New match or a different video clears it, after asking."}]}],noQuick:{drop:["t-quick","k-own","p-build","p-keys"],replace:{"gs-tag":{long:"Pick a player to tag a shot, or use Point A and Point B to score a rally without shot detail."},"t-detail":{label:"Tags"},"t-gap":{long:"A new tag within the minimum gap of another tag is blocked, and the message names that tag's time. Set the gap to 0 in Tag settings to turn this off."},"t-score":{long:"Every tag with a player or team is one point, replayed in video order. Winners and forced errors go to the tagged team, unforced errors to the other."},"p-default":{long:"Use as my default starts every new match with these setting "Set {name} as the hitter. Key {key}",secondServeChip:"Mark this tag as a 2nd serve",crumb:"Click to change this choice",step:{category:"The shot family. Some open a second row of types.",type:"The exact shot",hand:"Forehand or backhand",outcome:"Winner and forced error go to the hitter's team, unforced error to the other team",forced:"The opponent whose error this shot forced. Key 1 to 4",reason:"Where the error went"},court:"Click where the shot was hit from, not where it landed",skip:"Skip this step",cancel:"Discard this tag. Key Esc",finish:"Save the tag and carry on. Key Enter",save:"Save your changes. Key Enter",clipPre:"Seconds before this tag when jumping to it. Blank uses the panel's.",clipPost:"Seconds after this tag in a clip. Blank uses the panel's.",trayDone:"Close the tray",order:"Sort by video time or by when you tagged",jump:"Jump to this tag",time:"Click to type an exact time (mm:ss)",nudgeBack:"Half a second earlier: a point's rally end, or the tag. Shift-click for 2 seconds. Key comma",nudgeForward:"Half a second later: a point's rally end, or the tag. Shift-click for 2 seconds. Key period",edit:"Change this tag's details and clip window",board:"Open this point on the Tactics Board, with the players at their sides",delete:"Delete this tag. Key Delete when selected",shiftOpen:"Move every tag earlier or later by the same amount",shiftInput:"Seconds to move every tag. Use - for earlier.",shiftApply:"Move every tag by this many seconds",shiftCancel:"Close without shifting",mismatchDismiss:"Hide this warning until the next load",toggleOn:"Remove {type} {outcome} from your panel",toggleOff:"Add {type} {outcome} to your panel",tile:"Drag to reorder",key:"Click, then press the key for this button. Backspace clears it.",tray:"Show the player and court tray after this tag",remove:"Remove {button} from your panel",before:"Seconds played before a tag when you jump to it",after:"Seconds played after a tag in a clip",minGap:"Minimum seconds between new tags. 0

core, and under Strict rotation every team plays every other team once."},{id:"mexicano",label:"Mexicano",short:"Pairings drawn from the standings each round",long:"Individual scoring with only round 1 drawn up front. After each round the players closest together in the standings are grouped, so the leaders end up playing the leaders."},{id:"team-mexicano",label:"Team Mexicano",short:"Fixed pairs matched by standings each round",long:"Fixed pairs with the draw following the table. After each round the closest-ranked teams are matched, so only round 1 is known when you start."}]},{id:"setup",title:"Setting up",entries:[{id:"roundformat",label:"Timed rounds or Score rounds",long:"Timed rounds run to a clock sized to fit between your start and finish times, with a buzzer for warm-up and changeovers. Score rounds have no clock and a round ends when its scores are in."},{id:"scoreunit",label:"Points or Games",long:"This sets the word used for scores in entry, standings, and the shared view. It changes nothing about how scores are counted or ranked."},{id:"bestof",label:"Best of",long:"Every match plays the full target. The two scores have to add up to it, so entering one side fills in the other automatically."},{id:"firstto",label:"First to",long:"The first side to reach the target wins and the other side keeps whatever it scored. You enter both scores, and exactly one of them must have reached the target."},{id:"target",label:"Points or games per match",long:"Tap one of the presets or type any number from 4 to 99. New events start at 25."},{id:"rotation",label:"Strict or Smart rotation",long:"Strict plays the full rotation and works out the number of rounds for you. Smart lets you set the number of rounds and arranges them to avoid repeat partners first, then repeat opponents. Mexicano formats draw from the standings instead, so they have no rotation setting."},{id:"courts",label:"Courts",long:"Set how many courts you have. If there are not enough players or teams to fill them, the setup tells you how many can run at once."},{id:"timing",label:"Start, finish, warm-up and changeover",long:"Round length is worked out from the time between start and finish, less the warm-up and the changeovers. These apply to timed rounds only."}]},{id:"running",title:"Running the event",entries:[{id:"build",label:"Build schedule",short:"Draw the schedule from your players and settings",long:"Draws the schedule and shows it for review. Nothing starts until you tap Start event."},{id:"regenerate",label:"Regenerate",short:"Draw a different schedule from the same settings",long:"Draws another schedule from the same players and settings, in case you want a different arrangement of the same event."},{id:"editsetup",label:"Edit setup",short:"Go back to settings and drop this draw",long:"Returns to the setup form. The schedule you are looking at is dropped, and you build a new one when you are ready."},{id:"startround",label:"Starting and ending a round",long:"A timed round waits for your tap before the clock runs. The clock does not end the round: it keeps counting into overtime until you confirm the scores, so a long match never cuts itself off."},{id:"addminute",label:"Add a minute",short:"Add a minute to the running timer",long:"Adds a minute to whichever timer is running, whether that is the warm-up, a changeover, or a round that needs a little longer."},{id:"confirm",label:"Confirm scores",long:"Records the round and moves on. In Score rounds every court has to be valid first. In Mexicano formats the next round is drawn once these scores are in, so it reflects the result you just entered."},{id:"standings",label:"Standings",short:"See the table and correct a past round",long:"Shows the ranking table at any point, and lets you tap a completed round to correct a score."},{id:"correctround",label:"Correcting a past round",short:"Fix a score you entered wrong",long:"Opens a completed round so you can change what you entered, and the standings recompute as soon as you save. In Mexicano formats a round that was already drawn stays as it was drawn, because those pairings were made from the older standings."},{id:"tiebreak",label:"How ties are broken",long:"Ranking is by total score first, then by score difference. Anyone level on both shares the same rank, and the next rank skips to account for it."}]},{id:"saving",title:"Saving and resuming",entries:[{id:"saving",label:"Nothing is lost on a reload",long:"Your setup, the running event, and even the scores you have part-typed for the current round are saved on this device after every action. A reload keeps the clock in the right place too, because it stores the real finish time rather than counting down. You are asked whether to resume rather than being dropped straight back into the event."},{id:"leaveevent",label:"Leave event",long:"Steps back out to the setup screens and keeps everything. The event stays saved and you are offered it again next time you open the tool."},{id:"finishclear",label:"Finish and clear event",short:"Delete this event from this device",long:"Removes the event and its scores from this device. This is the only action that deletes them, and it cannot be undone."}]},{id:"sharing",title:"Sharing live",entries:[{id:"sharelive",label:"Share live",short:"Publish a read-only link for spectators",long:"Publishes a link and a QR code that anyone can open. You can share it before round 1, and until you start they see the player list and the draw."},{id:"viewers",label:"What spectators see",long:"While the event runs they see the current round with scores as they go in, plus the standings. Once it finishes the live marker changes to FINAL and the page shows the final table. They cannot change anything."},{id:"updates",label:"Updates are automatic",long:"Every change you make is published and spectators do not have to refresh. If your connection drops, the update is sent once you are back online."},{id:"expiry",label:"How long a link lasts",long:"The link stays live while you are still updating the event, and for 30 days after the last change."},{id:"stopsharing",label:"Stop sharing",short:"Stop publishing updates from this device",long:"Stops this device sending updates. It does not delete the link, which expires 30 days after your last change."}]}],tw=new Map;for(let e of Fp)for(let t of e.entries)t.short&&tw.set(t.id,t.short);var kt=e=>tw.get(e)||"";var Cr=function(e,t){let r=e,i=Xi[t],s=null,a=0,l=null,c=[],u={},f=function(S,k){a=r*4+17,s=(function(C){let R=new Array(C);for(let A=0;A<C;A+=1){R[A]=new Array(C);for(let O=0;O<C;O+=1)R[A][O]=null}return R})(a),p(0,0),p(a-7,0),p(0,a-7),v(),w(),g(S,k),r>=7&&b(S),l==null&&(l=T(r,i,c)),y(l,k)},p=function(S,k){for(let C=-1;C<=7;C+=1)if(!(S+C<=-1||a<=S+C))for(let R=-1;R<=7;R+=1)k+R<=-1||a<=k+R||(0<=C&&C<=6&&(R==0||R==6)||0<=R&&R<=6&&(C==0||C==6)||2<=C&&C<=4&&2<=R&&R<=4?s[S+C][k+R]=!0:s[S+C][k+R]=!1)},h=function(){let S=0,k=0;for(let C=0;C<8;C+=1){f(!0,C);let R=Gn.getLostPoint(u);(C==0||S>R)&&(S=R,k=C)}return k},w=function(){for(let S=8;S<a-8;S+=1)s[S][6]==null&&(s[S][6]=S%2==0);for(let S=8;S<a-8;S+=1)s[6][S]==null&&(s[6][S]=S%2==0)},v=function(){let S=Gn.getPatternPosition(r);for(let k=0;k<S.length;k+=1)for(let C=0;C<S.length;C+=1){let R=S[k],A=S[C];if(s[R][A]==null)for(let O=-2;O<=2;O+=1)for(let _=-2;_<=2;_+=1)O==-2||O==2||_==-2||_==2||O==0&&_==0?s[R+O][A+_]=!0:s[R+O][A+_]=!1}},b=function(S){let k=Gn.getBCHTypeNumber(r);for(let C=0;C<18;C+=1){let R=!S&&(k>>C&1)==1;s[Math.floor(C/3)][C%3+a-8-3]=R}for(let C=0;C<18;C+=1){let R=!S&&(k>>C&1)==1;s[C%3+a-8-3][Math.floor(C/3)]=R}},g=function(S,k){let C=i<<3|k,R=Gn.getBCHTypeInfo(C);for(let A=0;A<15;A+=1){let O=!S&&(R>>A&1)==1;A<6?s[A][8]=O:A<8?s[A+1][8]=O:s[a-15+A][8]=O}for(let A=0;A<15;A+=1){let O=!S&&(R>>A&1)==1;A<8?s[8][a-A-1]=O:A<9?s[8][15-A-1+1]=O:s[8][15-A-1]=O}s[a-8][8]=!S},y=function(S,k){let C=-1,R=a-1,A=7,O=0,_=Gn.getMaskFunction(k);for(let z=a-1;z>0;z-=2)for(z==6&&(z-=1);;){for(let Q=0;Q<2;Q+=1)if(s[R][z-Q]==null){let e

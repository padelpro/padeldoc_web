keep your own running total. Under Strict rotation everyone partners everyone else exactly once."},{id:"team-americano",label:"Team Americano",short:"Fixed pairs, every team plays every other",long:"Fixed pairs that stay together for the whole event. Both players bank the team score, and under Strict rotation every team plays every other team once."},{id:"mexicano",label:"Mexicano",short:"Pairings drawn from the standings each round",long:"Individual scoring with only round 1 drawn up front. After each round the players closest together in the standings are grouped, so the leaders end up playing the leaders."},{id:"team-mexicano",label:"Team Mexicano",short:"Fixed pairs matched by standings each round",long:"Fixed pairs with the draw following the table. After each round the closest-ranked teams are matched, so only round 1 is known when you start."}]},{id:"setup",title:"Setting up",entries:[{id:"roundformat",label:"Timed rounds or Score rounds",long:"Timed rounds run to a clock sized to fit between your start and finish times, with a buzzer for warm-up and changeovers. Score rounds have no clock and a round ends when its scores are in."},{id:"scoreunit",label:"Points or Games",long:"This sets the word used for scores in entry, standings, and the shared view. It changes nothing about how scores are counted or ranked."},{id:"bestof",label:"Best of",long:"Every match plays the full target. The two scores have to add up to it, so entering one side fills in the other automatically."},{id:"firstto",label:"First to",long:"The first side to reach the target wins and the other side keeps whatever it scored. You enter both scores, and exactly one of them must have reached the target."},{id:"target",label:"Points or games per match",long:"Tap one of the presets or type any number from 4 to 99. New events start at 25."},{id:"rotation",label:"Strict or Smart rotation",long:"Strict plays the full rotation and works out the number of rounds for you. Smart lets you set the number of rounds and arranges them to avoid repeat partners first, then repeat opponents. Mexicano formats draw from the standings instead, so they have no rotation setting."},{id:"courts",label:"Courts",long:"Set how many courts you have. If there are not enough players or teams to fill them, the setup tells you how many can run at once."},{id:"timing",label:"Start, finish, warm-up and changeover",long:"Round length is worked out from the time between start and finish, less the warm-up and the changeovers. These apply to timed rounds only."}]},{id:"running",title:"Running the event",entries:[{id:"build",label:"Build schedule",short:"Draw the schedule from your players and settings",long:"Draws the schedule and shows it for review. Nothing starts until you tap Start event."},{id:"regenerate",label:"Regenerate",short:"Draw a different schedule from the same settings",long:"Draws another schedule from the same players and settings, in case you want a different arrangement of the same event."},{id:"editsetup",label:"Edit setup",short:"Go back to settings and drop this draw",long:"Returns to the setup form. The schedule you are looking at is dropped, and you build a new one when you are ready."},{id:"startround",label:"Starting and ending a round",long:"A timed round waits for your tap before the clock runs. The clock does not end the round: it keeps counting into overtime until you confirm the scores, so a long match never cuts itself off."},{id:"addminute",label:"Add a minute",short:"Add a minute to the running timer",long:"Adds a minute to whichever timer is running, whether that is the warm-up, a changeover, or a round that needs a little longer."},{id:"confirm",label:"Confirm scores",long:"Records the round and moves on. In Score rounds every court has to be valid first. In Mexicano formats the next round is drawn once these scores are in, so it reflects the result you just entered."},{id:"standings",label:"Standings",short:"See the table and correct a past round",long:"S

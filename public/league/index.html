r List",long:"The button beside the title picks the view. Month shows the whole month, Week and Day the hours. List shows what's coming, day by day; Show earlier and Show later move it."}]},{id:"add",title:"Adding",entries:[{id:"types",label:"What you can add",long:"Tap + at the top: book a court, a gym session, anything off the court (gym, a run, an appointment), a lesson with your coach, a time you're not available, or log a session. An appointment is private: your coach sees a busy time and nothing else unless you tick Show my coach. On the calendar it adds to the day you're looking at. Tournaments live in My tournaments and show here on their own."},{id:"where",label:"Where",long:"Start typing the venue and pick it. A new one is saved at once and only you see it until it's checked. Not a venue keeps your words on this event only."},{id:"private",label:"Times you can't play",long:'Pick a reason. Mark it private and your coach sees only "Not available", with no reason, and it never goes to your calendar app.'},{id:"notes",label:"Notes",long:"Keep injury details out of notes. Log them in Niggles, where they stay private."}]},{id:"booking",title:"Add a booking",entries:[{id:"how",label:"From your club or court app",long:"Share the match from your club or court app, e.g. Playtomic or Matchpoint, copy it, then tap + and paste it into Add to your calendar. Check what we read, change anything, and save. If we can't read it, add the match by hand."},{id:"android",label:"On Android",long:"Add Padel Doc to your home screen from My page. Then Share in your club or court app lists Padel Doc, and the booking opens here ready to check."},{id:"iphone",label:"On iPhone",long:"iPhone can't share straight to a web app, so copy the share, tap + and paste it into Add to your calendar."},{id:"names",label:"Other players' names",long:"Names and levels stay on your calendar. Your coach sees them unless you turn that off. They never go to your calendar app, and they're deleted with the

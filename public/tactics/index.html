 a text box and type straight away, up to 200 characters. Drag it to move it, drag its bottom-right corner to make it wider or narrower (the words wrap), tap it to change the words, and tap the cross to delete it. The style bar sets the text colour and size, the fill and how solid it is, and the border. The last style you use is the next box's. Boxes belong to the step they're on, save with the play, flip with Mirror, and show in shares, Send to player and the player's copy."},...ge?[{id:"shot",label:Ce.tool.label,short:Ce.help.short,long:Ce.help.long}]:[],{id:"lock",label:"Lock",short:"Keep the drawing tool to draw several shapes in a row",long:"After each shape the board switches back to Move and selects the new shape, ready to style. Turn on the lock to keep the drawing tool instead, so you can draw several shapes in a row. Tap the lock again, or pick Move, to turn it off."}]},{id:"stylesection",title:"Styling a drawing",entries:[{id:"stylebar",label:"Style bar",long:"Tap a drawing to change its colour, thickness and line style. When a drawing is selected, the style bar sets its colour, thickness (thin, medium, thick) and line style (solid, dashed, dotted), turns an arrowhead on or off for lines, arrows and arcs, and turns the see-through fill on or off for zones and targets. The next drawing you make with the same tool starts in the same style. This is remembered on this device. On a phone the style bar sits at the bottom of the screen."},{id:"duplicate",label:"Duplicate",short:"Copy the selected drawing",long:"Makes a copy of the selected drawing just beside it, and selects the copy."},{id:"delete",label:"Delete",short:"Remove the selected drawing",long:"Removes the selected drawing. Undo brings it back."}]},{id:"stepsection",title:"Steps and playing a play",entries:[{id:"addstep",label:"Add step",short:"Copy this step as the next one",long:"A play is a series of steps. Add step copies the step on screen as the next one, so you only move what changes. Each step has its own player and ball positions and its own drawings. Use the arrows to move between steps."},{id:"play",label:"Play",short:"Animate the play from this step",long:"Plays the steps in order: the players and the ball move smoothly from one step to the next, and each step's drawings fade in when the move finishes. It plays from the step on screen (or from the start if you are on the last step) and stops at the end, unless Loop is on. Choose 0.5x, 1x or 2x to slow it down or speed it up (with a voice-over, it plays at the pace of your voice). Tapping the court, a tool or a button pauses on the step shown, ready to edit."},{id:"record",label:"Voice-over",short:"Record your voice over the play",long:"Press Record and allow the microphone. After a 3 second countdown the play starts from step 1: talk about the step on screen, then press Next to move to the next step. Press Stop when you have finished (it stops by itself after 3 minutes). Play then plays your voice, and the steps change at the moments you pressed Next, so the speed buttons are greyed out. Record again to replace it, or Delete recording to go back to silent animation. If you add or delete a step afterwards, the recording may no longer match: Play is silent until you re-record. The recording stays on this device; nothing is uploaded."},{id:"deletestep",label:"Delete step",short:"Remove the step on screen",long:"Removes the step on screen and shows the one before it. Undo brings it back."}]},{id:"templatesection",title:"Templates and Mirror",entries:[{id:"templates",label:"Templates",short:"Load a ready-made set play",long:"Opens a list of set plays grouped by type. One tap moves the players and the ball into place and adds the play's drawings. If the board already has drawings, or a play of more than one step, you are asked before it is replaced, because loading a template cannot be undone. Player names stay."},{id:"plays",label:"Plays",short:"Save this play, or open one you saved",long:"Save keeps the play on the board, with all its steps, drawings, player names and voice-over, in My plays on this device. Once saved, Save changes updates it and Save as a new play makes a separate copy. My plays lists every saved play: open one (you are asked first if the board has unsaved changes), rename it, duplicate it or delete it. Saved plays stay on this device; to give one to a player, use Send to player and choose Full play."},{id:"mirror",label:"Mirror",short:"Flip the board left to right",long:"Flips the players, the ball and every drawing left to right, on every step of the play, for example to show a play for a left-handed player. Players stay on their own side of the net. Press it again to flip back, or use Undo."}]},{id:"playersection",title:"Players",entries:[{id:"players",label:"Players",short:"Name the four players and set their hand",long:"Opens a list of all four players. Give each one a name of up to 12 characters and set them Right or Left handed. The name shows under the player and the hand shows as a small R or L badge. Reset names goes back to the names from the Match Tracker on this device, or to A1, A2, B1 and B2."},{id:"tapplayer",label:"Tap a player",long:"With Move selected, a quick tap on a player opens a card for just that player. A drag still moves them as usual. The ball has no card."}]},{id:"layers",title:"Layers",entries:[{id:"layersmenu",label:"Layers",short:"Court overlays: zones, coverage, and heatmap",long:"Holds the three court overlays. Each one switches on and off on its own, so you can show any combination of them at the same time."},{id:"zones",label:"Zones",short:"Split each half into net, transition, back",long:"Tapping cycles Off, Lines, and Shaded. Lines marks the three metre divider in each half and names the three bands up the side wall. Shaded adds a faint colour to each band on top of that."},{id:"coverage",label:"Coverage",short:"Show a 2 m radius around each player",long:"Lights the court that no player is standing within two  appointment), a lesson with your coach, a time you're not available, or log a session. An appointment is private: your coach sees a busy time and nothing else unless you tick Show my coach. On the calendar it adds to the day you're looking at. Tournaments live in My tournaments and show here on their own."},{id:"where",label:"Where",long:"Start typing the venue and pick it. A new one is saved at once and only you see it until it's checked. Not a venue keeps your words on this event only."},{id:"private",label:"Times you can't play",long:'Pick a reason. Mark it private and your coach sees only "Not available", with no reason, and it never goes to your calendar app.'},{id:"notes",label:"Notes",long:"Keep injury details out of notes. Log them in Niggles, where they stay private."}]},{id:"booking",title:"Add a booking",entries:[{id:"how",label:"From your club or court app",long:"Share the match from your club or court app, e.g. Playtomic or Matchpoint, copy it, then tap + and paste it into Add to your calendar. Check what we read, change anything, and save. If we can't read it, add the match by hand."},{id:"android",label:"On Android",long:"Add Padel Doc to your home screen from My page. Then Share in your club or court app lists Padel Doc, and the booking opens here ready to check."},{id:"iphone",label:"On iPhone",long:"iPhone can't share straight to a web app, so copy the share, tap + and paste it into Add to your calendar."},{id:"names",label:"Other players' names",long:"Names and levels stay on your calendar. Your coach sees them unless you turn that off. They never go to your calendar app, and they're deleted with the booking."},{id:"link",label:"The booking link",long:"We keep it so you can open it. We never contact Playtomic or Matchpoint."}]},{id:"coach",title:"Your coach",entries:[{id:"levels",label:"What your coach can do",long:"Nothing, View only, View and add (the default) or Full edit. Change it with Change at the top. Private entries stay private at every

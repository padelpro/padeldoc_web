he court",long:"Drag to draw a shaded oval over an area of court. The shading is see-through, and the style bar can turn it off. It stays on the board until you undo, delete or clear it."},{id:"target",label:"Target",short:"Mark a spot to aim at",long:"Tap the court to drop a ring just under a metre across, or keep dragging out from that point to widen it, up to eight metres across. Switch to Move to reposition or resize one you have already placed."},{id:"lock",label:"Lock",short:"Keep the drawing tool to draw several shapes in a row",long:"After each shape the board switches back to Move and selects the new shape, ready to style. Turn on the lock to keep the drawing tool instead, so you can draw several shapes in a row. Tap the lock again, or pick Move, to turn it off."}]},{id:"stylesection",title:"Styling a drawing",entries:[{id:"stylebar",label:"Style bar",long:"When a drawing is selected, the style bar sets its colour, thickness (thin, medium, thick) and line style (solid, dashed, dotted), turns an arrowhead on or off for lines, arrows and arcs, and turns the see-through fill on or off for zones and targets. The next drawing you make with the same tool starts in the same style. This is remembered on this device. On a phone the style bar sits at the bottom of the screen."},{id:"duplicate",label:"Duplicate",short:"Copy the selected drawing",long:"Makes a copy of the selected drawing just beside it, and selects the copy."},{id:"delete",label:"Delete",short:"Remove the selected drawing",long:"Removes the selected drawing. Undo brings it back."}]},{id:"templatesection",title:"Templates and Mirror",entries:[{id:"templates",label:"Templates",short:"Load a ready-made set play",long:"Opens a list of set plays grouped by type. One tap moves the players and the ball into place and adds the play's drawings. If the board already has drawings you are asked before they are replaced, because loading a template cannot be undone. Player names stay."},{id:"mirror",label:"Mirror",short:"Flip the board left to right",long:"Flips the players, the ball and every drawing left to right, for example to show a play for a left-handed player. Players stay on their own side of the net. Press it again to flip back, or use Undo."}]},{id:"playersection",title:"Players",entries:[{id:"players",label:"Players",short:"Name the four players and set their hand",long:"Opens a list of all four players. Give each one a name of up to 12 characters and set them Right or Left handed. The name shows under the player and the hand shows as a small R or L badge. Reset names goes back to the names from the Match Tracker on this device, or to A1, A2, B1 and B2."},{id:"tapplayer",label:"Tap a player",long:"With Move selected, a quick tap on a player opens a card for just that player. A drag still moves them as usual. The ball has no card."}]},{id:"layers",title:"Layers",entries:[{id:"layersmenu",label:"Layers",short:"Court overlays: zones, coverage, and heatmap",long:"Holds the three court overlays. Each one switches on and off on its own, so you can show any combination of them at the same time."},{id:"zones",label:"Zones",short:"Split each half into net, transition, back",long:"Tapping cycles Off, Lines, and Shaded. Lines marks the three metre divider in each half and names the three bands up the side wall. Shaded adds a faint colour to each band on top of that."},{id:"coverage",label:"Coverage",short:"Show a 2 m radius around each player",long:"Lights the court that no player is standing within two metres of, and rings each player with their own two metre reach. Drag someone and the open court moves with them."},{id:"heatmap",label:"Heatmap",short:"Shade the most open space to attack",long:"Shades the court by how far each point sits from the nearest opponent, the walls, and the net, with the freest spot showing strongest. A gap narrower than one and a half metres is left unshaded, because a ball cannot usefully be placed in it."}]},{id:"court",title:"How the court beha

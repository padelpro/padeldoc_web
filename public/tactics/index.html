ss."},a11y:{summary:"Estimate. Bounces {b} metres from the {wall}. Hits the glass at {g} metres. Sits up to {s} metres. Second bounce about {d} metres off the glass.",slider:"{word}, {n} kilometres per hour",backGlass:"back glass",net:"net"},help:{short:"A ball's path after the bounce and the glass, as an estimate.",long:"Press on a player and drag to where the ball first bounces. The board draws the flight, the rebound off the back or side glass, and an oval where the second bounce is likely to be. Use Speed and Spin to see how pace and spin change it. The side view shows how high the ball is at the glass and how much it sits up. It is an estimate from a simple model, not a measurement."}};var Ev=[{id:"tools",title:"Tools",entries:[{id:"move",label:"Move",short:"Drag players and the ball, or select a drawing",long:"Drag any player or the ball to a new position. Tap a player without dragging to change their name and hand. Tap a drawing to select it: drag it to move it, drag its round handles to reshape it (or resize a target), and use the style bar to change how it looks. Tap empty court to deselect."},{id:"line",label:"Line",short:"Draw a line between two areas of the court",long:"Drag to draw a straight line. Unlike the other drawings, a line can start and end anywhere on the board, including outside the court. A very short drag is discarded, so a stray tap leaves nothing behind."},{id:"arrow",label:"Arrow",short:"Draw an arrow between two points to show direction",long:"Drag from where the movement starts to where it ends. The head is drawn at the point you release. You can turn the head off, or add one to a line or arc, from the style bar."},{id:"arc",label:"Arc",short:"Show a motion path or curve",long:"Drag to draw a line that bows out to one side rather than running straight. Use it for a lob or a run around a player that a straight line would misstate."},{id:"zone",label:"Zone",short:"Circle an area of the court",long:"Drag to draw a shaded oval over an area of court. The shading is see-through, and the style bar can turn it off. It stays on the board until you undo, delete or clear it."},{id:"target",label:"Target",short:"Mark a spot to aim at",long:"Tap the court to drop a ring just under a metre across, or keep dragging out from that point to widen it, up to eight metres across. Switch to Move to reposition or resize one you have already placed."},{id:"text",label:"Text",short:"Write a note on the court",long:"Tap the court to place a text box and type straight away, up to 200 characters. Drag it to move it, drag its bottom-right corner to make it wider or narrower (the words wrap), tap it to change the words, and tap the cross to delete it. The style bar sets the text colour and size, the fill and how solid it is, and the border. The last style you use is the next box's. Boxes belong to the step they're on, save with the play, flip with Mirror, and show in shares, Send to player and the player's copy."},...le?[{id:"shot",label:be.tool.label,short:be.help.short,long:be.help.long}]:[],{id:"lock",label:"Lock",short:"Keep the drawing tool to draw several shapes in a row",long:"After each shape the board switches back to Move and selects the new shape, ready to style. Turn on the lock to keep the drawing tool instead, so you can draw several shapes in a row. Tap the lock again, or pick Move, to turn it off."}]},{id:"stylesection",title:"Styling a drawing",entries:[{id:"stylebar",label:"Style bar",long:"Tap a drawing to change its colour, thickness and line style. When a drawing is selected, the style bar sets its colour, thickness (thin, medium, thick) and line style (solid, dashed, dotted), turns an arrowhead on or off for lines, arrows and arcs, and turns the see-through fill on or off for zones and targets. The next drawing you make with the same tool starts in the same style. This is remembered on this device. On a phone the style bar sits at the bottom of the screen."},{id:"duplicate",label:"Duplicate",short:"Copy the selected drawing",long:"Makes a copy of the selected drawing just beside it, and selects the copy."},{id:"delete",label:"Delete",short:"Remove the selected drawing",long:"Removes the selected drawing. Undo brings it back."}]},{id:"stepsection",title:"Steps and playing a play",entries:[{id:"addstep",label:"Add step",short:"Copy this step as the next one",long:"A play is a series of steps. Add step copies the step on screen as the next one, so you only move what changes. Each step has its own player and ball positions and its own drawings. Use the arrows to move between steps."},{id:"play",label:"Play",short:"Animate the play from this step",long:"Plays the steps in order: the players and the ball move smoothly from one step to the next, and each step's drawings fade in when the move finishes. It plays from the step on screen (or from the start if you are on the last step) and stops at the end, unless Loop is on. Choose 0.5x, 1x or 2x to slow it down or speed it up (with a voice-over, it plays at the pace of your voice). Tapping the court, a tool or a button pauses on the step shown, ready to edit."},{id:"record",label:"Voice-over",short:"Record your voice over the play",long:"Press Record and allow the microphone. After a 3 second countdown the play starts from step 1: talk about the step on screen, then press Next to move to the next step. Press Stop when you have finished (it stops by itself after 3 minutes). Play then plays your voice, and the steps change at the moments you pressed Next, so the speed buttons are greyed out. Record again to replace it, or Delete recording to go back to silent animation. If you add or delete a step afterwards, the recording may no longer match: Play is silent until you re-record. The recording stays on this device; nothing is uploaded."},{id:"deletestep",label:"Delete step",short:"Remove the step on screen",long:"Removes the step on screen and shows the one before it. Undo brings it back."}]},{id:"templatesection",title:"Templates and Mirror",entries:[{id:"templates",label:"Templates",short:"Load a ready-made set play",long:"Opens a list of set plays grouped by type. One tap moves the players and the ball into place and adds the play's drawings. If the board already has drawings, or a play of more than one step, you are asked before it is replaced, because loading a template cannot be undone. Player names stay."},{id:"plays",label:"Plays",short:"Save this play, or open one you saved",long:"Save keeps the play on the board, with all its steps, drawings, player names and voice-over, in My plays on this device. Once saved, Save changes updates it and Save as a new play makes a separate copy. My plays lists every saved play: open one (you are asked first if the board has unsaved changes), rename it, duplicate it or delete it. Saved plays stay on this device; to give one to a player, use Send to player and choose Full play."},{id:"mirror",label:"Mirror",short:"Flip the board left to right",long:"Flips the players, the ball and every drawing left to right, on every step of the play, for example to show a play for a left-handed player. Players stay on their own side of the net. Press it again to flip back, or use Undo."}]},{id:"playersection",title:"Players",entries:[{id:"players",label:"Players",short:"Name the four players and set their hand",long:"Opens a list of all four players. Give each one a name of up to 12 characters and set them Right or Left handed. The name shows under the player and the hand shows as a small R or L badge. Reset names goes back to the names from the Match Tracker on this device, or to A1, A2, B1 and B2."},{id:"tapplayer",label:"Tap a player",long:"With Move selected, a quick tap on a player opens a card for just that player. A drag still moves them as usual. The ball has no card."}]},{id:"layers",title:"Layers",entries:[{id:"layersmenu",label:"Layers",short:"Court overlays: zones, coverage, and heatmap",long:"Holds the three court overlays. Each one switches on and off on its own, so you can show any combination of them at the same time."},{id:"zones",label:"Zones",short:"Split each half into net, transition, back",long:"Tapping cycles Off, Lines, and Shaded. Lines marks the three metre divider in each half and names the three bands up the side wall. Shaded adds a faint colour to each band on top of that."},{id:"coverage",label:"Coverage",short:"Show a 2 m radius around each player",long:"Lights the court that no player is standing within two metres of, and rings each player with their own two metre reach. Drag someone and the open court moves with them. Lit areas are open court, with no player within 2 m."},{id:"heatmap",label:"Heatmap",short:"Shade the most open space to attack",long:"Shades the court by how far each point sits from the nearest opponent, the walls, and the net, with the freest spot showing strongest. A gap narrower than one and a half metres is left unshaded, because a ball cannot usefully be placed in it."}]},{id:"court",title:"How the court behaves",entries:[{id:"halves",label:"Players stay in their half",long:"Team A holds the bottom half and team B the top. Dragging a player at the net stops them at the net line rather than letting them cross it."},{id:"door",label:"Leaving the court",long:"The side walls are solid except for a two metre gap beside the net. A player can only reach the outside area, or come back in, by passing through that gap."},{id:"outside",label:"Outside area",long:"The faint dashed strips beyond each side wall are where a player may legally play from off court. Each one runs three metres out and eight metres either side of the net."},{id:"ball",label:"The ball",long:"The ball ignores the walls and the halves, so you can put it out wide or past the back glass to show a ball that left the court."},{id:"saving",label:"What is saved",long:"The play on the board (every step, with its positions and drawings, and its voice-over), player names and hands, and the last style used for each draw
